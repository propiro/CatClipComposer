name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish portable Windows application
    runs-on: windows-latest
    steps:
      - name: Check out tagged source and Git LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate immutable tag and repository version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath "Directory.Build.props" -Raw -Encoding utf8
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Directory.Build.props contains an invalid release version: '$version'."
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match '$expectedTag'."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, validate, and package portable application
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "CatClipComposer-$env:APP_VERSION"
          $packagePath = Join-Path $releaseRoot "CatClipComposer"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          .\scripts\Publish-Portable.ps1 -OutputPath $packagePath

          $marker = @(Get-ChildItem -LiteralPath $packagePath -File -Filter 'version_*')
          if ($marker.Count -ne 1 -or $marker[0].Name -cne "version_$env:APP_VERSION") {
              throw "Published version marker does not match $env:APP_VERSION."
          }
          $reportedVersion = & (Join-Path $packagePath "CatClipComposer.Cli.exe") version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne "Cat Clip Composer v$env:APP_VERSION") {
              throw "Published CLI version check failed: '$reportedVersion'."
          }

          $zipName = "CatClipComposer-v$env:APP_VERSION-win-x64.zip"
          $zipPath = Join-Path $releaseRoot $zipName
          Compress-Archive -LiteralPath $packagePath -DestinationPath $zipPath -CompressionLevel Optimal
          $checksumPath = "$zipPath.sha256"
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          "RELEASE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create downloadable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$env:APP_VERSION.md"
          @"
          Cat Clip Composer v$env:APP_VERSION for Windows x64.

          1. Download CatClipComposer-v$env:APP_VERSION-win-x64.zip.
          2. Verify it with the adjacent .sha256 file.
          3. Extract the complete CatClipComposer folder over the folder you already use.
          4. Run CatClipComposer.exe.

          The archive is self-contained and includes the CLI, built-in plugin, documentation, fonts folder,
          and the separately packaged LGPL-compatible FFmpeg runtime with its license/source/build records.
          The application is not code-signed, so Windows may show an unknown-publisher warning.
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release create $env:GITHUB_REF_NAME `
              $env:RELEASE_ZIP $env:RELEASE_SHA `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag --fail-on-no-commits --latest `
              --title "Cat Clip Composer v$env:APP_VERSION" `
              --notes-file $notesPath
